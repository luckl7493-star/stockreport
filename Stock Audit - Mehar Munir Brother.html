<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock Audit - Mehar Munir Brother</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#fff;--panel:#F4F8F8;--line:#D5E0E1;--ink:#14181A;--muted:#68716C;--a:#0E7C86;--bad:#C62828;--badbg:#FBE3E3;--ok:#1B7A3E;--okbg:#E3F1E8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181B;--panel:#1D2426;--line:#2C373A;--ink:#F1F4F6;--muted:#9AA5AD;--a:#3FB6C1;--badbg:#4A2323;--okbg:#1E3A2A;--bad:#FF8A80;--ok:#7BD99A;}}
:root[data-theme="dark"]{--bg:#14181B;--panel:#1D2426;--line:#2C373A;--ink:#F1F4F6;--muted:#9AA5AD;--a:#3FB6C1;--badbg:#4A2323;--okbg:#1E3A2A;--bad:#FF8A80;--ok:#7BD99A;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,Segoe UI,Arial,sans-serif}
header{background:linear-gradient(90deg,#04343A,#0E7C86);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
header h1{margin:0;font-size:17px}header p{margin:2px 0 0;font-size:11px;opacity:.88}
.wrap{max-width:720px;margin:0 auto;padding:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
select,input[type=search]{flex:1 1 140px;min-width:0;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.btn{border:none;border-radius:10px;padding:11px 14px;font-weight:700;font-size:14px;cursor:pointer;background:var(--a);color:#fff}
.btn.alt{background:var(--bg);color:var(--a);border:1px solid var(--a)}
.btn.w{background:#fff;color:#04343A}
#st{font-size:12px;color:#fff;opacity:.95}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.sum div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px;font-size:11px;color:var(--muted);text-align:center}
.sum b{display:block;font-size:16px;color:var(--ink);font-family:ui-monospace,Menlo,monospace}
.hd,.r{display:grid;grid-template-columns:1fr 62px 96px 66px;gap:8px;align-items:center;padding:9px 8px}
.hd{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;border-bottom:2px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
.r{border-bottom:1px solid var(--line);cursor:pointer}
.r.sel{background:var(--panel);outline:2px solid var(--a);outline-offset:-2px;border-radius:8px}
.nm{font-weight:700;font-size:14px;line-height:1.25}.mt{font-size:10.5px;color:var(--muted);margin-top:2px}
.sy,.df{font-family:ui-monospace,Menlo,monospace;font-weight:700;text-align:center}
.sy{font-size:15px}
.ph{width:100%;padding:9px 6px;font-size:18px;font-weight:700;font-family:ui-monospace,Menlo,monospace;border:2px solid var(--a);border-radius:10px;background:var(--bg);color:var(--ink);text-align:center}
.ph.z{color:var(--muted);border-color:var(--line)}
.df{font-size:15px;border-radius:8px;padding:6px 2px}
.df.ok{background:var(--okbg);color:var(--ok)}.df.bad{background:var(--badbg);color:var(--bad)}
#list{padding-bottom:420px}
.fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;font-size:26px;border:none;background:var(--a);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:30;cursor:pointer}
.calc{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:2px solid var(--a);box-shadow:0 -6px 18px rgba(0,0,0,.2);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.ci{max-width:520px;margin:0 auto}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ch b{font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer}
.disp{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:6px 0;text-align:right}
.ex{font-size:22px;font-weight:700;font-family:ui-monospace,Menlo,monospace;min-height:28px;word-break:break-all}
.rv{font-size:12px;color:var(--muted);min-height:16px}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kp button{padding:11px 0;font-size:19px;font-weight:700;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.kp .op{background:var(--a);color:#fff;border-color:var(--a)}.kp .fn{color:var(--bad)}
.acts{display:grid;grid-template-columns:1.2fr 1.4fr 1fr 1fr;gap:6px;margin-top:6px}
.acts button{padding:11px 4px;font-size:13px;font-weight:700;border-radius:10px;border:none;background:var(--a);color:#fff;cursor:pointer}
.acts .alt{background:var(--bg);color:var(--a);border:1px solid var(--a)}
.hid{display:none}
</style>
</head>
<body>
<header>
  <div><h1>📦 Stock Audit</h1><p>Mehar Munir Brother · Wazirabad</p></div>
  <div><span id="st"></span> <button class="btn w" id="sv">💾 Save</button></div>
</header>
<div class="wrap">
  <div class="row"><select id="fp"></select><select id="fc"></select></div>
  <div class="row"><input type="search" id="q" placeholder="Search product…"></div>
  <div class="sum" id="sum"></div>
  <div class="row"><button class="btn" id="dx">⬇ Download Excel</button><button class="btn alt" id="rs">Reset all to 0</button></div>
  <div class="hd"><div>Product</div><div style="text-align:center">System</div><div style="text-align:center">Physical</div><div style="text-align:center">Diff</div></div>
  <div id="list"></div>
</div>
<button class="fab hid" id="fab">🧮</button>
<div class="calc" id="calc"><div class="ci">
  <div class="ch"><b id="cn">Tap a product row to count it</b><button id="chide">Hide ▼</button></div>
  <div class="disp"><div class="rv" id="rv"></div><div class="ex" id="ex">0</div></div>
  <div class="kp" id="kp"></div>
  <div class="acts"><button id="run">▶ Run (=)</button><button id="add">➕ Add to product</button><button class="alt" id="set">Set</button><button class="alt" id="undo">↶ Undo</button></div>
</div></div>
<script>
const DATA=[[21, "CSD", "1000 ML PET", "PEPSI", "1000 ML PET - PEPSI", 453.0], [22, "CSD", "1000 ML PET", "MIRINDA", "1000 ML PET - MIRINDA", 18.0], [23, "CSD", "1000 ML PET", "7-UP", "1000 ML PET - 7-UP", 305.0], [24, "CSD", "1000 ML PET", "M.DEW", "1000 ML PET - M.DEW", 1400.0], [62, "CSD", "1000 ML PET", "7UP MINT", "1000 ML PET - 7UP MINT", 0.0], [112, "Zero Sugar", "1000 ML PET", "7-UP ZERO", "1000 ML PET - 7-UP ZERO", 0.0], [129, "Water", "1000 ML PET-Revive", "LYCHEE BURST", "1000 ML PET-Revive - LYCHEE BURST", 43.0], [130, "Water", "1000 ML PET-Revive", "LEMONADE TWIST", "1000 ML PET-Revive - LEMONADE TWIST", 23.0], [93, "Slice Juices", "1000 ML Tetra Pack", "S-M-JUICE", "1000 ML Tetra Pack - S-M-JUICE", 56.0], [14, "CSD", "1500 ML PET", "PEPSI", "1500 ML PET - PEPSI", 999.0], [15, "CSD", "1500 ML PET", "MIRINDA", "1500 ML PET - MIRINDA", 15.0], [16, "CSD", "1500 ML PET", "7-UP", "1500 ML PET - 7-UP", 284.0], [17, "CSD", "1500 ML PET", "M.DEW", "1500 ML PET - M.DEW", 676.0], [114, "Zero Sugar", "1500 ML PET", "7-UP ZERO", "1500 ML PET - 7-UP ZERO", 0.0], [131, "CSD", "1500 ML PET", "7UP MINT", "1500 ML PET - 7UP MINT", 16.0], [94, "Water", "1500 ML PET AF", "Aquafina", "1500 ML PET AF - Aquafina", 2417.0], [84, "Slice Juices", "200 ML T.Pack", "S-M-JUICE", "200 ML T.Pack - S-M-JUICE", 339.0], [125, "CSD", "2000 ML PET 6BT", "PEPSI", "2000 ML PET 6BT - PEPSI", 78.0], [126, "CSD", "2000 ML PET 6BT", "M.DEW", "2000 ML PET 6BT - M.DEW", 407.0], [127, "CSD", "2000 ML PET 6BT", "7-UP", "2000 ML PET 6BT - 7-UP", 60.0], [82, "Slice Juices", "240 ML RB SLICE", "S-M-JUICE", "240 ML RB SLICE - S-M-JUICE", 86.0], [75, "Energy Drinks", "240 ML RB STING", "STING - BB", "240 ML RB STING - STING - BB", 538.0], [76, "Energy Drinks", "240 ML RB STING", "STING - GR", "240 ML RB STING - STING - GR", 0.0], [39, "CSD", "250 ML CAN", "MIRINDA", "250 ML CAN - MIRINDA", 15.0], [40, "CSD", "250 ML CAN", "7-UP", "250 ML CAN - 7-UP", 12.0], [41, "CSD", "250 ML CAN", "M.DEW", "250 ML CAN - M.DEW", 22.0], [43, "CSD", "250 ML CAN", "PEPSI", "250 ML CAN - PEPSI", 91.0], [103, "Zero Sugar", "250 ML CAN", "7-UP ZERO", "250 ML CAN - 7-UP ZERO", 16.0], [108, "Zero Sugar", "250 ML CAN", "PEPSI Zero", "250 ML CAN - PEPSI Zero", 0.0], [122, "CSD", "250 ML CAN", "7UP MINT", "250 ML CAN - 7UP MINT", 0.0], [80, "Energy Drinks", "250 ML CAN STING", "STING - BB", "250 ML CAN STING - STING - BB", 0.0], [1, "CSD", "250 ML RB", "PEPSI", "250 ML RB - PEPSI", 340.0], [2, "CSD", "250 ML RB", "MIRINDA", "250 ML RB - MIRINDA", 0.0], [4, "CSD", "250 ML RB", "7-UP", "250 ML RB - 7-UP", 268.0], [5, "CSD", "250 ML RB", "M.DEW", "250 ML RB - M.DEW", 1690.0], [128, "CSD", "250 ML RB", "7UP MINT", "250 ML RB - 7UP MINT", 0.0], [81, "Energy Drinks", "300 ML PET Sting", "STING - BB", "300 ML PET Sting - STING - BB", 274.0], [106, "Energy Drinks", "300 ML PET Sting", "STING - GR", "300 ML PET Sting - STING - GR", 0.0], [123, "Water", "300 ML PET-Revive", "LYCHEE BURST", "300 ML PET-Revive - LYCHEE BURST", 40.0], [124, "Water", "300 ML PET-Revive", "LEMONADE TWIST", "300 ML PET-Revive - LEMONADE TWIST", 0.0], [55, "CSD", "345 ML PET", "PEPSI", "345 ML PET - PEPSI", 680.0], [57, "CSD", "345 ML PET", "MIRINDA", "345 ML PET - MIRINDA", 0.0], [58, "CSD", "345 ML PET", "7-UP", "345 ML PET - 7-UP", 660.0], [59, "CSD", "345 ML PET", "M.DEW", "345 ML PET - M.DEW", 1611.0], [60, "CSD", "345 ML PET", "7UP MINT", "345 ML PET - 7UP MINT", 50.0], [115, "Zero Sugar", "345 ML PET", "7-UP ZERO", "345 ML PET - 7-UP ZERO", 16.0], [96, "Water", "5.0L PET Bottle Bulk Water", "Aquafina", "5.0L PET Bottle Bulk Water - Aquafina", 169.0], [27, "CSD", "500 ML PET", "PEPSI", "500 ML PET - PEPSI", 141.0], [28, "CSD", "500 ML PET", "MIRINDA", "500 ML PET - MIRINDA", 0.0], [29, "CSD", "500 ML PET", "7-UP", "500 ML PET - 7-UP", 145.0], [30, "CSD", "500 ML PET", "M.DEW", "500 ML PET - M.DEW", 152.0], [61, "CSD", "500 ML PET", "7UP MINT", "500 ML PET - 7UP MINT", 0.0], [116, "Zero Sugar", "500 ML PET", "7-UP ZERO", "500 ML PET - 7-UP ZERO", 0.0], [95, "Water", "500 ML PET AF", "Aquafina", "500 ML PET AF - Aquafina", 2967.0], [117, "Water", "500 ML PET GTR", "BLUE BOLT", "500 ML PET GTR - BLUE BOLT", 0.0], [118, "Water", "500 ML PET GTR", "LEMON & LIME", "500 ML PET GTR - LEMON & LIME", 0.0], [119, "Water", "500 ML PET GTR", "TROPICAL FRUIT", "500 ML PET GTR - TROPICAL FRUIT", 0.0], [120, "Water", "500 ML PET GTR", "MIX FLAVORS", "500 ML PET GTR - MIX FLAVORS", 0.0], [77, "Energy Drinks", "500 ML PET Sting", "STING - BB", "500 ML PET Sting - STING - BB", 1815.0], [78, "Energy Drinks", "500 ML PET Sting", "STING - GR", "500 ML PET Sting - STING - GR", 0.0]];
const $=id=>document.getElementById(id);
const R=DATA.map(r=>({pid:r[0],cat:r[1],pkg:r[2],brand:r[3],pname:r[4],sys:r[5],phy:0,adds:[],t:0}));
const fn=v=>Math.round(v*100)/100;
let sel=null,expr='',tmr=null;
try{const s=JSON.parse(localStorage.getItem('stk3')||'{}');R.forEach(r=>{const o=s[r.pid];if(o){r.phy=o.p||0;r.adds=o.a||[];r.t=o.t||0;}});}catch(e){}
function save(msg){
  try{const s={};R.forEach(r=>{if(r.t||r.phy)s[r.pid]={p:r.phy,a:r.adds,t:r.t};});localStorage.setItem('stk3',JSON.stringify(s));
    const d=new Date();$('st').textContent=(msg||'Saved')+' ✓ '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');}
  catch(e){$('st').textContent='Could not save on this device';}
}
const auto=()=>{clearTimeout(tmr);tmr=setTimeout(()=>save('Auto-saved'),400);};
$('sv').onclick=()=>save('Saved');

function fill(sel,vals,all){sel.innerHTML='';[all,...vals].forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;sel.appendChild(o);});}
fill($('fp'),R.map(r=>r.pname),'All products');
fill($('fc'),[...new Set(R.map(r=>r.cat))],'All categories');
function view(){
  const p=$('fp').value,c=$('fc').value,q=$('q').value.toLowerCase().trim();
  return R.filter(r=>(p==='All products'||r.pname===p)&&(c==='All categories'||r.cat===c)&&(!q||r.pname.toLowerCase().includes(q)));
}
function stats(){
  const v=view(),s=v.reduce((a,r)=>a+r.sys,0),p=v.reduce((a,r)=>a+r.phy,0),n=v.filter(r=>r.t).length;
  $('sum').innerHTML='';
  [['System',fn(s)],['Physical',fn(p)],['Difference',fn(s-p)],['Counted',n+'/'+v.length]].forEach(a=>{const d=document.createElement('div');d.textContent=a[0];const b=document.createElement('b');b.textContent=a[1];d.appendChild(b);$('sum').appendChild(d);});
}
function paint(r){
  const e=r._e;if(!e)return;const d=fn(r.sys-r.phy);
  e.df.textContent=d;e.df.className='df '+(d===0?'ok':'bad');
  e.inp.className='ph'+(r.t?'':' z');
  if(document.activeElement!==e.inp)e.inp.value=fn(r.phy);
  e.row.classList.toggle('sel',sel===r);
}
function pick(r){
  sel=r;R.forEach(x=>x._e&&x._e.row.classList.toggle('sel',x===r));
  $('cn').textContent=r.pname+'  ·  System '+fn(r.sys)+'  ·  Physical '+fn(r.phy);
}
function render(){
  const l=$('list');l.innerHTML='';
  view().forEach(r=>{
    const row=document.createElement('div');row.className='r';
    const a=document.createElement('div');const nm=document.createElement('div');nm.className='nm';nm.textContent=r.pname;
    const mt=document.createElement('div');mt.className='mt';mt.textContent=r.cat+' · ID '+r.pid;a.append(nm,mt);
    const sy=document.createElement('div');sy.className='sy';sy.textContent=fn(r.sys);
    const inp=document.createElement('input');inp.type='number';inp.inputMode='decimal';inp.className='ph';
    const df=document.createElement('div');
    row.append(a,sy,inp,df);l.appendChild(row);
    r._e={row,inp,df};paint(r);
    row.onclick=()=>pick(r);
    inp.onfocus=()=>pick(r);
    inp.oninput=()=>{r.phy=inp.value===''?0:+inp.value;r.t=1;r.adds=[];paint(r);stats();auto();if(sel===r)pick(r);};
    inp.onblur=()=>paint(r);
  });
  stats();
}
['fp','fc'].forEach(i=>$(i).onchange=render);$('q').oninput=render;
$('rs').onclick=()=>{if(!confirm('Set physical stock to 0 for all products?'))return;R.forEach(r=>{r.phy=0;r.adds=[];r.t=0;});save('Reset');render();};

/* calculator */
const KEYS=['C','⌫','(',')','7','8','9','÷','4','5','6','×','1','2','3','−','0','.','00','+'];
KEYS.forEach(k=>{const b=document.createElement('button');b.textContent=k;if('÷×−+'.includes(k))b.className='op';if(k==='C'||k==='⌫')b.className='fn';b.onclick=()=>key(k);$('kp').appendChild(b);});
function val(){
  const e=expr.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/[+\-*/.]+$/,'').replace(/(^|[^0-9.])0+(?=\d)/g,'$1');
  if(!e||!/^[0-9+\-*/.() ]+$/.test(e))return null;
  try{const v=Function('"use strict";return ('+e+')')();return isFinite(v)?Math.round(v*10000)/10000:null;}catch(x){return null;}
}
function show(){$('ex').textContent=expr||'0';const v=val();$('rv').textContent=(v!=null&&/[+\-*/÷×−]/.test(expr.slice(1)))?'= '+v:'';}
function key(k){if(k==='C')expr='';else if(k==='⌫')expr=expr.slice(0,-1);else expr+=k;show();}
$('run').onclick=()=>{const v=val();if(v!=null){expr=String(v);show();}};
function need(){if(!sel){$('rv').textContent='Tap a product row first';return false;}return true;}
$('add').onclick=()=>{const v=val();if(v==null||!need())return;sel.phy=Math.round((sel.phy+v)*10000)/10000;sel.adds.push(v);sel.t=1;expr='';paint(sel);stats();auto();pick(sel);show();$('rv').textContent='Added '+fn(v)+' → total '+fn(sel.phy);};
$('set').onclick=()=>{const v=val();if(v==null||!need())return;sel.phy=v;sel.adds=[v];sel.t=1;expr='';paint(sel);stats();auto();pick(sel);show();$('rv').textContent='Set to '+fn(v);};
$('undo').onclick=()=>{if(!need()||!sel.adds.length)return;const v=sel.adds.pop();sel.phy=Math.round((sel.phy-v)*10000)/10000;paint(sel);stats();auto();pick(sel);$('rv').textContent='Removed '+fn(v);};
$('chide').onclick=()=>{$('calc').classList.add('hid');$('fab').classList.remove('hid');};
$('fab').onclick=()=>{$('calc').classList.remove('hid');$('fab').classList.add('hid');};

/* excel */
async function dl(name,data){const d=await claude.use('downloads');
  if(!d){$('st').textContent='Open this page in your browser to download';return;}
  try{await d.save({filename:name,data});}catch(e){if(e.code!=='declined')$('st').textContent='Could not save file';}}
$('dx').onclick=()=>{
  save('Saved');
  const H=['REGION_NAME','Unit','Dist_Code','Dist_Name','Product_Category','PKG_NAME','BRAND_NAME','PRODUCT_ID','PRODUCT_NAME','System Stock','Physical Stock','Difference'];
  const a=[H,...R.map(r=>['Gujrat','Wazirabad',101041,'Mehar Munir Brother',r.cat,r.pkg,r.brand,r.pid,r.pname,r.sys,r.phy,''])];
  const ws=XLSX.utils.aoa_to_sheet(a);
  R.forEach((r,i)=>{ws['L'+(i+2)]={t:'n',f:'J'+(i+2)+'-K'+(i+2),v:r.sys-r.phy};});
  const s=R.reduce((x,r)=>x+r.sys,0),p=R.reduce((x,r)=>x+r.phy,0);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Distributor','System Stock','Physical Stock','Difference'],['Mehar Munir Brother',s,p,s-p],['Grand Total',s,p,s-p]]),'Summary');
  XLSX.utils.book_append_sheet(wb,ws,'Stock Report');
  dl('Stock_Audit_'+new Date().toISOString().slice(0,10)+'.xlsx',new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})]));
};
render();show();
</script>
</body>
</html>
